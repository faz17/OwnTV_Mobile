name: OwnTV Mobile Dispatcharr - test APK

on:
  push:
    branches:
      - feature/dispatcharr-source-switch
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # create signed GitHub Releases
  statuses: write

concurrency:
  group: mobile-dispatcharr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Mobile fork
        uses: actions/checkout@v4
        with:
          path: OwnTV_Mobile
          persist-credentials: false

      - name: Checkout modified Core
        uses: actions/checkout@v4
        with:
          repository: faz17/OwnTV_Core
          ref: feature/dispatcharr-source-switch
          path: OwnTV_Core
          persist-credentials: false

      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Core unit tests
        working-directory: OwnTV_Core
        run: |
          chmod +x ./gradlew
          set -o pipefail
          # Retry only Maven Central HTTP 429 rate limits, not genuine test failures.
          for attempt in 1 2 3; do
            if ./gradlew :core:testDebugUnitTest :player-core:testDebugUnitTest --console=plain --no-daemon 2>&1 | tee core-test.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && grep -Eq 'status code 429|Too Many Requests' core-test.log; then
              echo "::warning::Maven Central HTTP 429; retrying Core tests (attempt $((attempt + 1))/3)."
              sleep $((attempt * 30))
            else
              break
            fi
          done
          {
            echo "### Core test or compilation errors" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            grep -E -A 9 -B 3 '(^e: |^error: |^FAILURE:|^\\* What went wrong:|^> Task .*FAILED|^Execution failed for task|^> Could not|^.*tests? FAILED|^.*Exception:|^.*AssertionError)' core-test.log | tail -n 120 >> "$GITHUB_STEP_SUMMARY" || true
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      # A runner's default debug certificate changes between CI environments and
      # cannot update a previously installed APK. Use the repository's persistent
      # signing key; do not silently distribute a debug-key-signed replacement.
      # Only branch pushes may access signing secrets; PRs compile but do not
      # publish a signed installation artifact.
      - name: Prepare persistent APK signing
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing signing secret for $key. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in repository Actions secrets."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/owntv-mobile-signing.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/owntv-mobile-signing.keystore" >> "$GITHUB_ENV"
          echo "OWNTV_SIGN_DEBUG_WITH_RELEASE_KEY=true" >> "$GITHUB_ENV"
          # Passwords and alias are supplied through the build step's environment, not logged.

      - name: Build Mobile ARM debug APK with modified Core
        working-directory: OwnTV_Mobile
        env:
          CORE_DIR: ${{ github.workspace }}/OwnTV_Core
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:assembleStandardDebug "-Powntv.corePath=$CORE_DIR" --console=plain --no-daemon 2>&1 | tee mobile-build.log || {
            echo "### Mobile build errors" >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
            grep -E -A 9 -B 3 '(^e: |^error: |^FAILURE:|^\* What went wrong:|^> Could not|^> Task .*FAILED|Unresolved reference|Compilation error|Could not find|^Execution failed for task)' mobile-build.log | tail -n 110 >> "$GITHUB_STEP_SUMMARY" || true
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Relevant build errors"
            grep -E -A 9 -B 3 '(^e: |^error: |^FAILURE:|^\* What went wrong:|^> Could not|^> Task .*FAILED|Unresolved reference|Compilation error|Could not find|^Execution failed for task)' mobile-build.log | tail -n 110 || true
            echo "::endgroup::"
            exit 1
          }

      - name: Verify stable signing certificate
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          APK=$(find OwnTV_Mobile/app/build/outputs/apk/standard/debug -name '*.apk' -type f | head -n 1)
          test -n "$APKSIGNER" && test -n "$APK"
          # apksigner's certificate output differs between SDK revisions; grep
          # must never turn a correctly verified APK into a failed build.
          # The exit status of apksigner itself is authoritative.
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK signature verified successfully with apksigner."

      - name: Upload mobile APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: OwnTV-Mobile-Dispatcharr-signed-debug
          path: OwnTV_Mobile/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Keep the first versioned release immutable. In-app updates read
      # the latest numbered GitHub Release from faz17/OwnTV_Mobile, not upstream.
      - name: Check first Mobile fork release
        id: first_release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      # Use the same persistent certificate as the already-installable signed
      # debug APK, and a greater versionCode so Android installs it in place.
      - name: Build signed Mobile v2.0.0 release
        if: steps.first_release.outputs.create == 'true'
        working-directory: OwnTV_Mobile
        env:
          CORE_DIR: ${{ github.workspace }}/OwnTV_Core
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export VERSION_CODE=$((300000 + ${GITHUB_RUN_NUMBER}))
          export VERSION_NAME=2.0.0
          ./gradlew :app:lintStandardDebug :app:assembleStandardRelease "-Powntv.corePath=$CORE_DIR" --stacktrace --no-daemon
          APK=$(find app/build/outputs/apk/standard/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          mkdir -p ../dist
          cp "$APK" ../dist/OwnTV-Mobile-v2.0.0.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs ../dist/OwnTV-Mobile-v2.0.0.apk

      - name: Publish first versioned Mobile fork release
        if: steps.first_release.outputs.create == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.0.0
          target_commitish: ${{ github.sha }}
          name: OwnTV Mobile Dispatcharr v2.0.0
          prerelease: false
          make_latest: true
          files: dist/OwnTV-Mobile-v2.0.0.apk
          fail_on_unmatched_files: true
          body: |
            First versioned release of the faz17 OwnTV Mobile fork.
            Includes Dispatcharr DVR recordings, scheduled recordings, EPG actions,
            list/grid layouts, navigation fixes and Italian translations.

            The app checks faz17/OwnTV_Mobile for future GitHub Releases, instead of
            offering an upstream APK that would overwrite the customizations.

            Use the same permanent signing certificate and a higher Android versionCode
            for every future release. Existing debug preview installations use
            a high placeholder versionName (99.99.99): install this first release
            manually once before in-app version checks can compare correctly.
            Personal data and preferences stay on the device when Android accepts
            an in-place signed upgrade.

      # Expose the first compiler failure as a commit status. GitHub's Actions
      # logs are not always accessible through repository API clients.
      - name: Publish sanitized build error
        if: ${{ failure() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ERROR=""
          # Report the actual Kotlin/source diagnostic before generic Gradle task failures.
          # A task label alone hid the error in earlier builds.
          for file in OwnTV_Mobile/mobile-build.log OwnTV_Core/core-test.log; do
            if [ -f "$file" ]; then
              ERROR=$(grep -E -m 1 '^e: |^error: |^.*\.kt:[0-9]+:[0-9]+: error: |^.*\.kt:[0-9]+: error: ' "$file" || true)
              if [ -n "$ERROR" ]; then break; fi
            fi
          done
          if [ -z "$ERROR" ]; then
            for file in OwnTV_Mobile/mobile-build.log OwnTV_Core/core-test.log; do
              if [ -f "$file" ]; then
                ERROR=$(grep -E -m 1 '^FAILURE:|^> Task .*FAILED|^Execution failed for task|^.*tests? FAILED' "$file" || true)
                if [ -n "$ERROR" ]; then break; fi
              fi
            done
          fi
          ERROR="${ERROR:-Build failed (see Actions report)}"
          # Strip long CI workspace prefixes so the file, line and diagnostic fit.
          if [[ "$ERROR" == "e: file://"* ]]; then
            ERROR="e: ${ERROR##*/}"
          fi
          ERROR="${ERROR:0:130}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure -f context=diagnostics/owntv-mobile-build -f description="$ERROR"

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OwnTV-Mobile-Dispatcharr-reports
          path: |
            OwnTV_Core/core-test.log
            OwnTV_Core/core/build/reports/**
            OwnTV_Core/player-core/build/reports/**
            OwnTV_Mobile/app/build/reports/**
            OwnTV_Mobile/mobile-build.log
          if-no-files-found: ignore
